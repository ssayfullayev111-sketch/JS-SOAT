
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="timer">
        <div class="box">
            <h1 id="hours">17</h1>
            <p>Hours</p>
        </div>

        <div class="box">
            <h1 id="minutes">24</h1>
            <p>Minutes</p>
        </div>

        <div class="box">
            <h1 id="seconds">47</h1>
            <p>Seconds</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
